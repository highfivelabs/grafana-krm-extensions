apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: team-a
stringData:
  token: <token>
---
apiVersion: core.grafana.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://grafana.example.com/api
  secretRef:
    name: grafana-credentials
