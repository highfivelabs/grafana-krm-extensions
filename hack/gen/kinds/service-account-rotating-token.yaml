terraform: [grafana_service_account_rotating_token]
shape: crud
params:
  serviceAccountId:
    type: integer
fields:
  name_prefix:
    type: string
  seconds_to_live:
    type: integer
    minimum: 0
  early_rotation_window_seconds:
    type: integer
    minimum: 0
  delete_on_destroy:
    type: boolean
required: [name_prefix, seconds_to_live, early_rotation_window_seconds]
rotate: {prefix: name_prefix, lifetime: seconds_to_live, window: early_rotation_window_seconds, seconds: true, deleteOnDelete: delete_on_destroy, name: name, ttl: secondsToLive}
secretOutputs: [key]
sample:
  serviceAccountId: 1
  name_prefix: example
  seconds_to_live: 2592000
  early_rotation_window_seconds: 86400
  delete_on_destroy: true
serverFields:
  key: glsa_example
  created: '2026-01-01T00:00:00Z'
  expiration: '2026-01-31T00:00:00Z'
  hasExpired: false
  isRevoked: false
  secondsUntilExpiration: 2592000
create:
  method: POST
  path: /serviceaccounts/{serviceAccountId}/tokens
read:
  method: GET
  path: /serviceaccounts/{serviceAccountId}/tokens
  find: {field: id}
delete:
  method: DELETE
  path: /serviceaccounts/{serviceAccountId}/tokens/{id}
