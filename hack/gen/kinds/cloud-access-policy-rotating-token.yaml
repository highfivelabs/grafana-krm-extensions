terraform: [grafana_cloud_access_policy_rotating_token]
shape: crud
fields:
  region:
    type: string
  accessPolicyId:
    type: string
  displayName:
    type: string
  name_prefix:
    type: string
    minLength: 1
    maxLength: 200
  expire_after:
    type: string
  early_rotation_window:
    type: string
  delete_on_destroy:
    type: boolean
required: [region, accessPolicyId, name_prefix, expire_after, early_rotation_window]
createOnly: [accessPolicyId]
queryFields: [region]
rotate: {prefix: name_prefix, lifetime: expire_after, window: early_rotation_window, deleteOnDelete: delete_on_destroy, name: name, expiresAt: expiresAt}
secretOutputs: [token]
sample:
  region: example-region
  accessPolicyId: example-access-policy-id
  name_prefix: example
  expire_after: 720h
  early_rotation_window: 24h
  delete_on_destroy: true
serverFields:
  token: glc_example
  orgId: '1'
  createdAt: '2026-01-01T00:00:00Z'
  updatedAt: '2026-01-01T00:00:00Z'
create:
  method: POST
  path: /v1/tokens
  query: {region: "{region}"}
read:
  method: GET
  path: /v1/tokens/{id}
  query: {region: "{region}"}
update:
  method: POST
  path: /v1/tokens/{id}
  query: {region: "{region}"}
delete:
  method: DELETE
  path: /v1/tokens/{id}
  query: {region: "{region}"}
