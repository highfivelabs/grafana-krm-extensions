terraform: [grafana_apps_secret_keeper_activation_v1beta1]
kind: AppsSecretKeeperActivationV1beta1
shape: settings
params:
  namespace: {type: string}
  name: {type: string}
envelope: status
state:
  field: active
  description: "true activates this keeper (POST .../keepers/{name}/activate); false activates the system keeper (POST .../keepers/system/activate), as deleting the object does."
  calls:
    "true": {method: POST, path: "/apis/secret.grafana.app/v1beta1/namespaces/{namespace}/keepers/{name}/activate", sendBody: true}
    "false": {method: POST, path: "/apis/secret.grafana.app/v1beta1/namespaces/{namespace}/keepers/system/activate", sendBody: true}
  delete: "false"
sample: {namespace: default, name: example-keeper, active: "true"}
read: {method: GET, path: "/apis/secret.grafana.app/v1beta1/namespaces/{namespace}/keepers/{name}"}
