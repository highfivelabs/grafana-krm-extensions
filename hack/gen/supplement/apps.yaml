          format: double
        result:
          description: Config to apply when the value is within the range
          default: {}
          allOf:
          - $ref: '#/components/schemas/com.github.grafana.grafana.apps.dashboard.pkg.apis.dashboard.v2.DashboardValueMappingResult'
