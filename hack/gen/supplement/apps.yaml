      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - dashboard.grafana.app/v1beta1
          default: dashboard.grafana.app/v1beta1
        kind:
          type: string
          enum:
          - Dashboard
          default: Dashboard
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          description: Spec is the spec of the Dashboard
          allOf:
          - $ref: '#/components/schemas/com.github.grafana.grafana.pkg.apimachinery.apis.common.v0alpha1.Unstructured'
    DashboardDashboardV1Beta1:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - dashboard.grafana.app/v1beta1
          default: dashboard.grafana.app/v1beta1
        kind:
          type: string
          enum:
          - Dashboard
          default: Dashboard
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          description: Spec is the spec of the Dashboard
          allOf:
          - $ref: '#/components/schemas/com.github.grafana.grafana.pkg.apimachinery.apis.common.v0alpha1.Unstructured'
        status:
          type: object
          readOnly: true
          additionalProperties: true
    com.github.grafana.grafana.apps.dashboard.pkg.apis.dashboard.v2beta1.DashboardSpec:
      type: object
      required:
      - annotations
      - cursorSync
      - elements
      - layout
      - links
      - preload
      - tags
      - timeSettings
      - title
      - variables
      properties:
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/com.github.grafana.grafana.apps.dashboard.pkg.apis.dashboard.v2beta1.DashboardAnnotationQueryKind'
        cursorSync:
          description: Configuration of dashboard cursor sync behavior. "Off" for no shared crosshair or tooltip (default). "Crosshair" for shared crosshair. "Tooltip" for shared crosshair AND shared tooltip.
          type: string
          default: ''
        description:
          description: Description of dashboard.
          type: string
        editable:
          description: Whether a dashboard is editable or not.
          type: boolean
        elements:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/com.github.grafana.grafana.apps.dashboard.pkg.apis.dashboard.v2beta1.DashboardPanelKindOrLibraryPanelKind'
